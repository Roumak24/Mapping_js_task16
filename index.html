<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Records</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: #000; }
    .page { max-width: 760px; margin: 0 auto; background: #fff; min-height: 100vh; }
    header { display: flex; justify-content: space-between; align-items: center;
             padding: 18px 32px; border-bottom: 1px solid #eee; }
    header h3 { font-size: 14px; font-weight: 500; color: #333; }
    .login { background: #e8eefc; color: #3b5bdb; border: none; border-radius: 20px;
             padding: 10px 28px; font-size: 11px; font-weight: 500; cursor: pointer; }
    .search-bar { display: flex; align-items: center; gap: 8px; margin: 20px 32px;
                  padding: 14px; border: 1px solid #eee; border-radius: 14px; }
    .input-wrap { position: relative; width: 192px; }
    .input-wrap input { width: 100%; padding: 11px 32px 11px 14px; border: none;
                        background: #f1f2f3; border-radius: 8px; font-size: 11px; outline: none; }
    .input-wrap span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
                       font-size: 11px; color: #666; }
    .search-btn { background: #6d1ee0; color: #fff; border: none; border-radius: 6px;
                  padding: 11px 26px; font-size: 11px; font-weight: 500; cursor: pointer; }
    .search-btn:hover { background: #5a16c0; }
    .container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
                 padding: 0 32px 32px; }
    .card { background: #f3f4f4; border-radius: 8px; padding: 12px; }
    .card p { font-size: 10.5px; color: #444; margin: 9px 0; }
    .card b { font-weight: 600; color: #111; }
    .no-result { grid-column: 1 / -1; text-align: center; font-size: 13px; color: #777; padding: 30px; }
    @media (max-width: 640px) { .container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h3>Hi, Username</h3>
      <button class="login">Login</button>
    </header>

    <div class="search-bar">
      <div class="input-wrap">
        <input type="text" id="searchInput" placeholder="Search Student">
        <span>&#128269;</span>
      </div>
      <button class="search-btn" id="searchBtn">Search</button>
    </div>

    <div class="container" id="studentContainer"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
